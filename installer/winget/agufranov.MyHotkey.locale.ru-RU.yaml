PackageIdentifier: agufranov.MyHotkey
PackageVersion: 1.0.0
PackageLocale: ru-RU
Publisher: agufranov
PackageName: MyHotkey
License: MIT
ShortDescription: Переназначение клавиш для Windows, настраивается мышкой
Description: |-
  Переназначение клавиш для Windows. То же, что делает AutoHotkey, но
  настраивается мышкой и стартует мгновенно.

  Разнесено на два процесса. На автозагрузке висит движок на 116 КБ - чистый
  Win32 без рантайма, поэтому хоткеи работают уже в первые миллисекунды после
  входа в систему. Окно настроек запускается по требованию и на автозагрузку
  не влияет.

  Запись сочетания идёт через низкоуровневый хук, а не через события окна,
  поэтому ловятся даже Alt+Tab и Win+R, которые оболочка обычно забирает
  раньше любого приложения.

  Действия: отправить сочетание, напечатать текст, запустить программу,
  переключить раскладку, проглотить клавишу. Правило можно ограничить
  конкретной программой.
Moniker: myhotkey
